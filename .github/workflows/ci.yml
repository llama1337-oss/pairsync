name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No package-lock.json (the project has zero runtime dependencies),
      # so `npm ci` is not usable here.
      - run: npm install --no-audit --no-fund
      # No global git identity step: every test fixture repo sets its own
      # local user.name/user.email (and commit.gpgsign=false), so the runner
      # only needs `git` on PATH, which ubuntu-latest already has.
      - run: npm test
